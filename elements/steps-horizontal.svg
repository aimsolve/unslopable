<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="480" height="280">
<title>steps (horizontal) — schematic</title>
<desc>Wireframe, no brand: four numbered circles 1 to 4 on one horizontal line, left to right. Under each circle a short bold title bar and two short grey lines. Only for a few steps with short bodies.</desc>
<rect x="0" y="0" width="240" height="140" fill="#ffffff"/>
