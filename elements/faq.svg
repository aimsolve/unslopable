<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="480" height="280">
<title>faq — schematic</title>
<desc>Wireframe, no brand: two question-and-answer pairs split by a thin rule. Each pair: a filled circle with a question mark, a bold line (the question), then two grey lines (the short answer).</desc>
<rect x="0" y="0" width="240" height="140" fill="#ffffff"/>
<line fill="none" stroke="#d6d6d6" stroke-width="1" x1="20" y1="68" x2="220" y2="68"/><circle fill="#222222" cx="27" cy="26" r="7"/><text fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="700" x="27" y="30" font-size="10" text-anchor="middle">?</text><rect fill="#222222" x="42" y="23" width="140" height="7" rx="3.5"/><rect fill="#bdbdbd" x="42" y="39" width="176" height="6" rx="3"/><rect fill="#bdbdbd" x="42" y="51" width="120" height="6" rx="3"/><circle fill="#222222" cx="27" cy="82" r="7"/><text fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="700" x="27" y="86" font-size="10" text-anchor="middle">?</text><rect fill="#222222" x="42" y="79" width="140" height="7" rx="3.5"/><rect fill="#bdbdbd" x="42" y="95" width="176" height="6" rx="3"/><rect fill="#bdbdbd" x="42" y="107" width="120" height="6" rx="3"/>
</svg>
