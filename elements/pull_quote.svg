<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="480" height="280">
<title>pull_quote — schematic</title>
<desc>Wireframe, no brand: between faint lines of body text, a black vertical bar on the left, a large opening quote mark, two large bold lines of the quote, then a short dash and a grey line naming who said it.</desc>
<rect x="0" y="0" width="240" height="140" fill="#ffffff"/>
<rect fill="#bdbdbd" opacity="0.45" x="20" y="12" width="200" height="6" rx="3"/><rect fill="#bdbdbd" opacity="0.45" x="20" y="25" width="170" height="6" rx="3"/><rect fill="#222222" x="20" y="44" width="4" height="54" rx="2"/><text fill="#222222" font-weight="600" x="34" y="78" font-size="44" font-family="Georgia, serif">“</text><rect fill="#222222" x="62" y="52" width="150" height="9" rx="4.5"/><rect fill="#222222" x="62" y="68" width="118" height="9" rx="4.5"/><line fill="none" stroke="#222222" stroke-width="1.5" x1="62" y1="91" x2="74" y2="91"/><rect fill="#bdbdbd" x="80" y="88" width="60" height="6" rx="3"/><rect fill="#bdbdbd" opacity="0.45" x="20" y="114" width="200" height="6" rx="3"/><rect fill="#bdbdbd" opacity="0.45" x="20" y="127" width="150" height="6" rx="3"/>
