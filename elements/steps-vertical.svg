<title>steps (vertical) — schematic</title>
<desc>Wireframe, no brand: four numbered circles 1 to 4 down a vertical line on the left. To the right of each circle a bold title bar and one or two grey lines of body. Fits more steps and longer bodies than the horizontal form.</desc>
