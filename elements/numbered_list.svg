<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="480" height="280">
<title>numbered_list — schematic</title>
<desc>Wireframe, no brand: four items numbered 1. to 4., each one grey line of text; the order matters.</desc>
<rect x="0" y="0" width="240" height="140" fill="#ffffff"/>
<text fill="#222222" font-family="Helvetica, Arial, sans-serif" font-weight="600" x="20" y="40" font-size="11">1.</text><rect fill="#bdbdbd" x="40" y="33" width="150" height="6" rx="3"/><text fill="#222222" font-family="Helvetica, Arial, sans-serif" font-weight="600" x="20" y="62" font-size="11">2.</text><rect fill="#bdbdbd" x="40" y="55" width="120" height="6" rx="3"/><text fill="#222222" font-family="Helvetica, Arial, sans-serif" font-weight="600" x="20" y="84" font-size="11">3.</text><rect fill="#bdbdbd" x="40" y="77" width="170" height="6" rx="3"/><text fill="#222222" font-family="Helvetica, Arial, sans-serif" font-weight="600" x="20" y="106" font-size="11">4.</text><rect fill="#bdbdbd" x="40" y="99" width="100" height="6" rx="3"/>
</svg>
